# Josh 360's background jobs on the laptop (JP-105).
#
# laptop/run_jobs.py reads this file every 5 minutes and runs each job that is due, in this order.
# It is started by one entry in the macbook-automations startup list, so a new job here needs no
# change anywhere else: merge it, and the laptop picks it up on its next pass.
#
# Shape (the reader is strict and stops on anything else):
#   - id: a lower-case name
#     run: a .py file in this repo
#     every: 10m, 1h, 1d, or once (once: runs until it succeeds one time)
#     timeout: optional, default 15m
#     report: optional, true means the job prints JSON, which goes to laptop-status as reports/<id>.json
#     description: optional
#
# The first job must be follow.

jobs:
  - id: follow
    run: laptop/follow.py
    every: 10m
    timeout: 10m
    description: Move the laptop's copy to main, run the install script, report on laptop-status.

  - id: inventory
    run: scripts/laptop_inventory_job.py
    every: once
    timeout: 30m
    report: true
    description: JP-96's read-only laptop inventory, once. Names, paths, sizes and counts only.

  - id: retire-focus-dashboard
    run: scripts/retire_focus_dashboard.py
    every: once
    timeout: 5m
    report: true
    description: JP-100, once. Boots out the focus dashboard's launchd job and archives its plist under ~/Archive/josh-360-retired/. Reversible; deletes nothing.

  - id: ledger-record
    run: ledger/record.py
    every: 5m
    timeout: 10m
    description: JP-107. Writes sessions, episodes, refs and homes to the ledger from the hook spool, transcript metadata and git. No model call.

  - id: ledger-summary
    run: ledger/summary.py
    every: 5m
    timeout: 15m
    description: JP-108. Writes about five summary lines for each episode that has gone quiet. Copies from the title, the first line of the first message and STATE.md; one small cheap-tier call only when those are too thin. JP-113: the same call also fills in the debrief form for an episode that earns one (a graph run, or friction facts at a threshold), and an episode that earns a debrief but can be copied gets a debrief-only call. At most one model call per episode; none for a .phi folder.

  - id: ledger-backup
    run: ledger/backup.py
    every: 1d
    timeout: 10m
    description: JP-107. Copies the ledger with SQLite's backup call, checks the copy, gzips it, keeps 14 daily and 8 weekly. No upload (that is ledger-upload).

  - id: ledger-upload
    run: ledger/upload.py
    every: 1d
    timeout: 30m
    report: true
    description: JP-150. Makes the Azure blob container hold the same daily backups as the laptop (14 daily, 8 weekly), signed in as Josh through az login, no stored secret. Does any redaction the uploaded copies still owe. The report says ok, failed or not-configured and when the last upload worked; it never fails the backup.

  - id: ledger-backfill
    run: ledger/backfill.py
    every: once
    timeout: 60m
    report: true
    description: JP-107, once. Brings existing transcripts, Atlas lineage and titles, and cost links into the ledger. The report is counts only.

  - id: ledger-friction-catchup
    run: ledger/friction_write.py
    every: once
    timeout: 30m
    report: true
    description: JP-112, once. Writes friction facts and usage for episodes recorded before JP-112 merged, from their transcripts. Counts and codes only, no model call. The report is counts only.

  - id: ticket-comments
    run: ledger/comments.py
    every: 5m
    timeout: 5m
    report: true
    description: JP-118. Passes new Jira comments on a ticket to the sessions and graph runs working on it (a file the session's hook reads; a folder in the run for the binding), once each, recorded in the ledger. Skips comments the system wrote. No model call. The report is counts only.

  - id: retire-session-atlas
    run: scripts/retire_session_atlas.py
    every: once
    timeout: 10m
    report: true
    description: JP-111, once, after the ledger backfill has finished. Stops the old Session Atlas, takes its hook entries out of ~/.claude/settings.json (backup kept), seeds cache.db from the old cost ledger and archives atlas.db and the old cost ledger under ~/Archive/josh-360-retired/. Reversible; deletes nothing.

  - id: session-atlas-service
    run: scripts/atlas_service.py
    every: 1h
    timeout: 5m
    report: true
    description: JP-111. Keeps the headless Session Atlas (apps/session-atlas) loaded in launchd on the latest code. It waits until retire-session-atlas has succeeded. No model call.

  - id: doctor
    run: scripts/doctor_job.py
    every: 1d
    timeout: 5m
    report: true
    description: JP-152. Runs the platform doctor (scripts/doctor.py, read-only) and publishes its JSON, so the cloud can see which parts of Josh 360 are live and configured on the laptop. A failing check shows in the report, never in this job's exit code. No model call.

  - id: retire-leftover-jobs
    run: scripts/retire_leftover_jobs.py
    every: once
    timeout: 5m
    report: true
    description: JP-119, once. Boots out the QA waker watchdog, the ClickUp to Notion sync and Omnara, moves their plists (and Omnara's folder) into ~/Archive/josh-360-retired/, and writes a retired.json that scripts/restore_retired_job.py reads to put each one back. Reversible; deletes nothing.

  - id: launchd-check
    run: scripts/launchd_check_job.py
    every: 1d
    timeout: 5m
    report: true
    description: JP-119. Compares what runs on the laptop with the macbook-automations startup list and laptop/launchd-register.json, and reports any difference. Job labels and counts only; changes nothing.

  - id: graph-runner
    run: graphs/runner/tick_job.py
    every: 5m
    timeout: 5m
    report: true
    description: JP-117. Watches Jira for tickets that should have a graph run (Ready and in an open sprint) and moves every open run forward one step, each model step in a visible Agent Manager session. No model call of its own. The report is counts, ids, step names and times only.

  - id: jp-117-triage-jp-116
    run: graphs/runner/triage_jp116_job.py
    every: 1h
    timeout: 5m
    report: true
    description: JP-117, temporary. Starts the triage run of JP-116, the runner's proof ticket, once the runner has ticked; does nothing once that run exists. Removed with the proof page.
