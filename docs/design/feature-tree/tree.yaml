- id: AD
  name: agent-deck (laptop hooks)
  about: "Not in any of the three repositories: a third-party program at ~/.local/bin/agent-deck whose hook runs in every Claude Code session on the laptop. Included because you asked for detail."
  detail:
  - "What it is: agent-deck (github.com/asheshgoplani/agent-deck) is an open-source Go program, a tmux-based session manager for AI coding agents. One terminal screen lists Claude Code, Codex, OpenCode, Gemini and other sessions, with groups, search, forking a session into a new git worktree, per-session MCP and skill pickers, a 'conductor' that watches sessions and escalates over Telegram, Slack or Discord, and a local web view on port 8420."
  - "What is on your laptop: the binary at ~/.local/bin/agent-deck and its hook-handler registered on 7 events in ~/.claude/settings.json (SessionStart, UserPromptSubmit, Notification for permission and elicitation prompts, PermissionRequest, PreCompact, Stop with AGENTDECK_STOP_SYNC=1, and SessionEnd). The 16 November laptop run found no agent-deck process running and no agent-deck data folder in its listing, so it does not look like it is in use. A folder from 27 September, ~/Development/active/deliverables/2026-09-27/agent-deck-security-audit, suggests you had it audited once."
  - "What the hook does: it only acts inside sessions agent-deck itself started (it reads AGENTDECK_INSTANCE_ID and exits silently when that is not set). In those sessions it writes a status file per session under ~/.agent-deck/hooks/ (running, waiting or dead). On PermissionRequest it can answer 'allow' by itself when the session was started with --dangerously-skip-permissions, or deny and queue a question in an unattended conductor turn. On Stop it can block the turn from ending, up to 3 times in a row, to make Claude read messages waiting in agent-deck's inbox. On UserPromptSubmit it can add inbox text and a list of child sessions to your prompt. It always exits 0, so it never stops Claude Code by failing."
  - "What it costs you today: in your ordinary sessions (Agent Manager, the terminal, the daemon) it does nothing but start a process on each of those 7 events. The risk is small but real: any process that sets AGENTDECK_INSTANCE_ID gets the auto-allow and Stop-blocking behaviour, and it shares PermissionRequest and Stop with your other hooks."
  - "How to remove it: `agent-deck hooks uninstall` removes only its entries and keeps your other hooks (and restores the status line if it wrapped it); `agent-deck uninstall --keep-data` removes the program too. Its data, if any, is under ~/.agent-deck/, ~/.local/share/agent-deck/ and ~/.config/agent-deck/."
  - "Sources: the project's README, docs/claude-status-hooks.md, cmd/agent-deck/hook_handler.go and PR #3095 on GitHub, read 17 November 2026; claude-harness docs/harness/hooks-inventory.md (8 November); the JP-96 laptop run (16 November). The installed version was not checked; it has no PreToolUse hook, which newer versions add, so it is probably an older install."
  children:
  - id: AD.hooks
    name: agent-deck
    children:
    - id: D1
      name: agent-deck the program
      what: "A tmux session manager: session list, groups, forking into worktrees, MCP and skill pickers, conductor escalation, web view."
      call: drop
      how: retire
      why: "Agent Manager is your session manager now, and josh-360 binds the walker to it (JP-117). The ideas worth having (a worktree per piece of work, escalating to you) are covered by the runner's branch contract and Needs you. Not running on the laptop on 16 November."
      carrier: JP-120
    - id: D2
      name: agent-deck hook-handler on 7 events
      what: "Status files, auto-allow on permission requests and inbox-driven Stop blocking, for sessions agent-deck started."
      call: drop
      how: retire
      why: "A no-op in every session you actually run, but it starts a process 7 times a session and can auto-allow or keep a turn running for anything that sets its variable. Remove it with `agent-deck hooks uninstall` at the phase 1 close."
      carrier: JP-120
      children:
      - id: D2.1
        name: Status hooks (SessionStart, UserPromptSubmit, Notification, PreCompact, SessionEnd)
        what: "Write running/waiting/dead to ~/.agent-deck/hooks/<id>.json; UserPromptSubmit can add inbox text to the prompt."
        call: drop
        how: retire
        why: "Only agent-deck's own screen reads these files. The ledger's recorder (S1.1) records session status for josh-360."
        carrier: JP-120
      - id: D2.2
        name: PermissionRequest decision
        what: "Answers allow for sessions started with --dangerously-skip-permissions; denies and queues a question in unattended conductor turns."
        call: drop
        how: retire
        why: "Permission answers on your laptop should come from your settings and the runner's guardrails (A16.3), not from a third-party hook."
        carrier: JP-120
      - id: D2.3
        name: Synchronous Stop hook (inbox delivery)
        what: "Blocks a turn from ending up to 3 times to deliver agent-deck inbox messages."
        call: drop
        how: retire
        why: "Passing messages to a running session is JP-118's job, built on the ticket mailbox (A11)."
        carrier: JP-120, JP-118
