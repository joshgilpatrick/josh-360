tiers:
  cheap:                                  # fully specified, mechanical work
    - { provider: claude, model: claude-haiku-5-5, thinking: high }
    - { provider: claude, model: claude-sonnet-5-5 }          # fallback if Haiku is out of tokens
  mid: { provider: claude, model: claude-sonnet-5-5 }          # intake, design, moderate ambiguity
  gate: { provider: claude, model: claude-opus-5-5, thinking: high }   # hardening gate only
agent:
  tier: mid
  mode: bypassPermissions
manager:
  mode: default
providers:
  exhausted_for: 1h
  on_exhausted: wait
timeout: 1h
isolation: worktree
