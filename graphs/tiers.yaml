# The three tiers, cheapest first, mapped to models. This is the only file that names a model.
# The first model in a list is used; the rest are fallbacks, in order. See graphs/CONVENTION.md, "Tiers".
convention: 1
tiers:
  cheap:                                          # fully specified, mechanical work
    - { model: claude-haiku-5-5, effort: high }
    - claude-sonnet-5-5                           # when Haiku is out of tokens
  mid:                                            # intake, design, moderate ambiguity
    - claude-sonnet-5-5
  gate:                                           # judgments that need the most foresight; never builds
    - { model: claude-opus-5-5, effort: high }
