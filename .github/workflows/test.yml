# CI runs once per PR, when the PR is ready for Josh (label review:ready-for-human), and on every push to
# main. Pushes to a PR branch run nothing: run the suite locally first. There is no paths-ignore: the suite
# checks Markdown and docs too, and the label gate already limits a PR to one run.
name: test

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

# A newer run cancels an older one. Adding any other label also starts a run (GitHub cannot filter `labeled` by
# name); that run does nothing, so it gets its own group and never cancels a real one.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'review:ready-for-human' && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  suite:
    if: github.event_name != 'pull_request' || github.event.label.name == 'review:ready-for-human'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Tickets that add code add their install and test steps here, and in .claude/workflow.config.md.
      # JP-111: Session Atlas (apps/session-atlas) is Node 22.18 or newer, runs TypeScript directly and has no runtime
      # dependency. The hook tests in tests/ also start Node.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: pip install -r requirements.txt
      - name: Fast checks
        run: python3 scripts/check.py --fast
      # The full suite adds the tests in tests/ (stdlib unittest; the laptop's Python is 3.9, which
      # scripts/check.py checks by parsing).
      - name: Full suite
        run: python3 -m unittest discover -s tests -v
      - name: Session Atlas install
        run: npm ci --prefix apps/session-atlas
      - name: Session Atlas typecheck
        run: npm run typecheck --prefix apps/session-atlas
      - name: Session Atlas tests
        run: npm test --prefix apps/session-atlas
