# CI runs once per PR, when the PR is ready for Josh (label review:ready-for-human), on every push to main, and
# on every later push to a PR branch that already carries a review label (JP-153). The label gate keeps the
# first pushes of a PR from running anything: run the suite locally first. The later pushes are the ones that
# merge main in or apply audit findings; without this a thread waited for a check that never started. There is
# no paths-ignore: the suite checks Markdown and docs too.
name: test

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

# A newer run cancels an older one. Two kinds of event start a run that does nothing: adding a label other than
# review:ready-for-human (GitHub cannot filter `labeled` by name), and a push to a PR with no review label. Each
# gets its own group, so it never cancels a real run. Keep the two label tests in `group` and in `if` identical.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}${{ ((github.event.action == 'labeled' && github.event.label.name != 'review:ready-for-human') || (github.event.action == 'synchronize' && !contains(github.event.pull_request.labels.*.name, 'review:ready-for-human') && !contains(github.event.pull_request.labels.*.name, 'review:needs-agent-audit') && !contains(github.event.pull_request.labels.*.name, 'review:changes-requested'))) && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  suite:
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action == 'labeled' && github.event.label.name == 'review:ready-for-human')
      || (github.event.action == 'synchronize' && (
        contains(github.event.pull_request.labels.*.name, 'review:ready-for-human')
        || contains(github.event.pull_request.labels.*.name, 'review:needs-agent-audit')
        || contains(github.event.pull_request.labels.*.name, 'review:changes-requested')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Tickets that add code add their install and test steps here, and in .claude/workflow.config.md.
      # JP-111: Session Atlas (apps/session-atlas) is Node 22.18 or newer, runs TypeScript directly and has no runtime
      # dependency. The hook tests in tests/ also start Node.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: pip install -r requirements.txt
      - name: Fast checks
        run: python3 scripts/check.py --fast
      # JP-115: the gate scripts' own tests (graphs/tests/, stdlib unittest); check.py skips them with --fast.
      - name: Gate tests
        run: python3 -m unittest discover -s graphs/tests
      # The full suite adds the tests in tests/ (stdlib unittest; the laptop's Python is 3.9, which
      # scripts/check.py checks by parsing).
      - name: Full suite
        run: python3 -m unittest discover -s tests -v
      - name: Session Atlas install
        run: npm ci --prefix apps/session-atlas
      - name: Session Atlas typecheck
        run: npm run typecheck --prefix apps/session-atlas
      - name: Session Atlas tests
        run: npm test --prefix apps/session-atlas

  # JP-188: a whole graph run in the cloud. The real Agent Manager (built once and cached by version), the stand-in
  # Claude Code and the strict fake Jira carry the made-up ticket JP-9116 through each scenario in tests/e2e/runs/ on
  # a sandbox laptop that runs its jobs with Python 3.9. Same events as `suite` (keep the two `if`s identical). The
  # evidence is uploaded whether it passed or not.
  e2e:
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action == 'labeled' && github.event.label.name == 'review:ready-for-human')
      || (github.event.action == 'synchronize' && (
        contains(github.event.pull_request.labels.*.name, 'review:ready-for-human')
        || contains(github.event.pull_request.labels.*.name, 'review:needs-agent-audit')
        || contains(github.event.pull_request.labels.*.name, 'review:changes-requested')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The last version listed is the default python3; the laptop's jobs run on python3.9.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tmux
          pip install -r requirements.txt
          git config --global user.name "josh-360 e2e"
          git config --global user.email "e2e@example.invalid"
      - name: Agent Manager cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/josh360-e2e
          key: agent-manager-0.47.1-${{ runner.os }}-${{ runner.arch }}
      - name: Agent Manager install
        run: python3 tests/e2e/agent_manager.py install
      - name: Agent Manager tests
        env:
          JOSH360_E2E_AM: '1'
        run: python3 -m unittest discover -s tests -t tests -p 'test_e2e_*.py' -v
      - name: Whole runs
        run: python3 scripts/e2e.py --all --python "$(command -v python3.9)" --evidence "$RUNNER_TEMP/e2e-evidence"
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: ${{ runner.temp }}/e2e-evidence
          if-no-files-found: warn
