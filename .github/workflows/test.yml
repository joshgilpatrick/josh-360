# CI runs once per PR, when the PR is ready for Josh (label review:ready-for-human), and on every push to
# main. Pushes to a PR branch run nothing: run the suite locally first.
name: test

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    types: [labeled]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

# A newer run cancels an older one. Adding any other label also starts a run (GitHub cannot filter `labeled` by
# name); that run does nothing, so it gets its own group and never cancels a real one.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'review:ready-for-human' && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  suite:
    if: github.event_name != 'pull_request' || github.event.label.name == 'review:ready-for-human'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Tickets that add code add their install and test steps here, and in .claude/workflow.config.md.
      - name: Fast checks
        run: python3 scripts/check.py
      - name: Full suite
        run: python3 scripts/check.py
