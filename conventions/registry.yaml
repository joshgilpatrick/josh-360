# System registry (JP-98). Rules: conventions/tickets.md, "Routing a ticket to a space and a parent".
#
# One entry per system: the folders and repositories it lives in, its department area of responsibility,
# where its tickets go, its default parent epic and the priority it falls under. A script answers "where does
# this folder or repository belong?" from this file alone, with no AI:
#
#   python3 scripts/conventions.py lookup --folder ~/Development/active/keystone-platform
#   python3 scripts/conventions.py lookup --repo eventuswh-apps/keystone-platform
#
# A folder or repository no entry lists is Unassigned, and a ticket for it goes to the fallback space (JP)
# with no parent. Nothing is guessed from a similar name. Check after every edit:
#
#   python3 scripts/conventions.py check
#
# Fields:
#   name          The system, spelled as its Jira label (the lowercase repository name). Unique.
#   description   One line.
#   repositories  Bare repository names, no owner (owners change during the GitHub org migration).
#                 Hyphens and underscores count as the same spelling.
#   folders       Folders on Josh's work laptop. ~ is his home folder. A folder inside another listed
#                 folder belongs to the deeper entry.
#   area          The department area of responsibility, from `areas` below. Optional for personal systems.
#   tracker       jira (work) or linear (personal).
#   jira_space    Where its tickets go. Never TECH, which holds initiatives only.
#   linear_team   For tracker: linear.
#   default_epic  The parent for a new ticket when nothing better is known, in the same space, or null.
#                 Only an epic with an end belongs here; an open-ended catch-all epic does not.
#   priority      An id from conventions/priorities.yaml. If priorities.yaml maps the system's area to a
#                 priority, the two must agree.
#
# Seeded on 16 November 2026 from labels and epics in Jira and from paths named in Josh's repositories.
# Folders were not checked on the laptop; JP-105 (the laptop hookup) can confirm them. Josh confirms the
# seeded rows at JP-106. Default choices are recorded in docs/decisions.md.

version: 1

fallback:
  jira_space: JP
  priority: unassigned

spaces:
  JP: Josh Projects. Josh's own intake and every DevEx ticket. Work that becomes team work moves to CI or AD.
  AD: Apps Development. Software work for the clinical team.
  CI: Clinical Informatics. Operational and clinical work, such as EHR administration and the Athena build.
  TECH: Technology Projects. Department initiatives only; a ticket never lives here.

# Department areas of responsibility (draft names from the department work convention, held in the
# department SharePoint; team leads may still rename them). Value: the team that owns the area.
areas:
  Reporting and BI delivery: Analytics
  Analytics applications: Analytics
  Data platform operations: Data Engineering
  Source data integration and modeling: Data Engineering
  Data access governance: Data Engineering
  EHR administration: Clinical Informatics
  Clinical data migration and integration: Clinical Informatics
  Clinical application platform: Clinical Informatics
  Clinical quality programs: Clinical Informatics
  Automation and AI enablement: Clinical Informatics
  Identity and access: Security and IT Ops
  Security operations and data protection: Security and IT Ops
  Compliance and risk: Security and IT Ops

