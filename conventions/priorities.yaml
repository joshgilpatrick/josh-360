# Josh's standing priorities (JP-98). Josh edits this file by hand.
#
# The six he is answerable for, as he named them at a leadership forum, and a seventh he added at the JP-106
# sitting (Internal Systems & Applications), plus DevEx (shown only in Josh 360)
# and Unassigned (what is left over, kept honest so time outside the six can be counted). Nothing is forced
# into a bucket: work that matches none of the links below is Unassigned.
#
# Each priority points at what it covers in Jira. A ticket's priority comes from its epic first, then the
# initiative its epic relates to, then its area:
#
#   python3 scripts/conventions.py priority --epic AD-198
#
# A link may point at one priority only. Working agents never read this file; only the step that links work
# to priorities does, and it picks from this list. Weekly priorities are not here: Josh marks them in Jira.
# Check after every edit: python3 scripts/conventions.py check
#
# kind:      standing (one of the seven), devex or unassigned.
# shown_to:  department (the seven) or josh (DevEx and Unassigned appear only in Josh 360).
# covers:    areas (names from conventions/registry.yaml), initiatives (TECH keys) and epics.
#
# The covers lists were seeded on 16 November 2026 from the open epics in AD, CI and JP and the initiatives in
# TECH. Josh reviewed the unassigned systems at JP-106 (16 November 2026; docs/decisions.md). A priority with empty lists is real; nothing in Jira is tied to it yet.

